{% extends 'ads/base.html' %}

{% block title %}Регистрация — Авито Клон{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 8px; border: 1px solid #e2e2e2;">
    <h2 style="margin-bottom: 20px; text-align: center;">Регистрация</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary" style="width: 100%; border: none; margin-top: 15px; cursor: pointer;">Создать аккаунт</button>
    </form>
    
    <p style="margin-top: 20px; text-align: center; font-size: 14px; color: #595959;">
        Уже есть аккаунт? <a href="{% url 'ads:login' %}" style="color: #00aa63; text-decoration: none;">Войти</a>
    </p>
</div>
{% endblock %}
